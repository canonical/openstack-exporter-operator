type: charm
name: openstack-exporter
title: OpenStack Exporter
summary: Openstack exporter for Charmed OpenStack
description: |
  This is an exporter that exposes information gathered from Openstack for use
  by the Prometheus monitoring system. This operator works with the Canonical
  Observability Stack (COS).
subordinate: false

parts:
  charm:
    source: .
    plugin: uv
    build-snaps:
      - astral-uv
    build-packages:
      - git
  # Bundle cos-tool so the charm can validate the alert_rules config with
  # Prometheus' own rule parser at runtime.
  cos-tool:
    plugin: dump
    source: https://github.com/canonical/cos-tool/releases/latest/download/cos-tool-${CRAFT_ARCH_BUILD_FOR}
    source-type: file
    permissions:
      - path: cos-tool-${CRAFT_ARCH_BUILD_FOR}
        mode: "755"

platforms:
  ubuntu@22.04:amd64:
  ubuntu@24.04:amd64:

actions:
  get-alert-rules:
    description: |
      Dump the alert rules currently in effect as a single Prometheus rules
      document (YAML), returned in the `alert-rules` result. Use this as a starting
      point for the `alert_rules` config option: dump the rules, edit them,
      then set the edited document as the `alert_rules` config.

      Because `juju run` wraps the result under the unit name, extract the raw
      document before saving. For example:

        juju run openstack-exporter/leader get-alert-rules --format=json \
          | jq -r 'first(.[]).results."alert-rules"' > rules.yaml

      Edit rules.yaml, then apply it:

        juju config openstack-exporter alert_rules="$(cat rules.yaml)"

requires:
  credentials:
    interface: keystone-admin

provides:
  cos-agent:
    interface: cos_agent
    limit: 1

# These bindings can be used to explicitly request interfaces in all the OpenStack
# network spaces. Needed when APIs are not exposed in the same network as the one bound
# to the credentials endpoint
extra-bindings:
  admin:
  public:
  internal:

config:
  options:
    port:
      type: int
      default: 9180
      description: |
        The openstack-exporter service (metrics endpoint for prometheus scraping)
        will listen at this port.
    ssl_ca:
      default: ""
      type: string
      description: |
        Custom SSL CA for keystone if required.

        The format should be the raw contents of a PEM encoded file.
        (no base64 encoding).
    cache_ttl:
      default: "300s"
      type: string
      description: |
        Cache expiry time-to-live (TTL), e.g., 10s, 11m, 12h. Cache refreshes at
        intervals of cache_ttl/2.
        Customizable based on the size of the OpenStack cluster.
        Format details: https://pkg.go.dev/time#ParseDuration
    cache:
      default: true
      type: boolean
      description: |
        By default, enables the exporter cache globally. Refreshes at intervals of cache_ttl/2.
        If the cache is empty or expired, the response will be empty.
    snap_channel:
      default: "latest/stable"
      type: string
      description: |
        The charmed-openstack-exporter snap is by default installed from the latest/stable channel.
        This option allows the selection of a different channel.

        If the snap file has been attached via the openstack-exporter resource, this option has no effect.
    alert_rules:
      default: ""
      type: string
      description: |
        A full Prometheus alert rules document (YAML) that replaces the alert rules shipped
        with the charm. Empty string (default) keeps the shipped rules.

        Use this to customise severities, thresholds and `for:` durations, or to add or remove
        alerts. The value must be a valid Prometheus rules file with a top-level `groups` key. 
        For example:

          groups:
            - name: NovaCompute
              rules:
                - alert: NovaComputeDown
                  expr: openstack_nova_agent_state{adminState="enabled"} == 0
                  for: 2m
                  labels:
                    severity: critical
                  annotations:
                    summary: Nova Compute Agent Down

        Warning: Changing this option reloads the alert rules in Prometheus. 
        Any currently firing alerts that are removed by the new rules will be canceled 
        and reported to Alert Manager as resolved.

charm-libs:
  - lib: grafana-agent.cos_agent
    version: "0"

links:
  documentation: https://discourse.charmhub.io/t/openstack-exporter-docs-index/13876
  issues:
  - https://github.com/canonical/openstack-exporter-operator/issues
  source:
  - https://github.com/canonical/openstack-exporter-operator
  website:
  - https://github.com/canonical/openstack-exporter-operator

resources:
  openstack-exporter:
    type: file
    filename: openstack-exporter.snap
    description: |
      Snap for openstack-exporter.
      This is the software that implements actual metrics collection and an endpoint for prometheus
      scraping. The snap resource on Charmhub is intended to be an empty file. The charm will
      ignore an empty file resource and normally install the snap from the snap store, but a
      custom snap can also be provided here if needed.

      This resource has priority: if this resource is present,
      the snap will be installed from the resource, and the snap_channel option will have no effect.
